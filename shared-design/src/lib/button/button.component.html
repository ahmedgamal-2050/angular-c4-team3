<button
  [type]="type()"
  [disabled]="disabled()"
  (click)="onClick()"
  class="shared-button {{
    buttonClass()
  }} rounded-lg w-full disabled:bg-zinc-300 disabled:text-zinc-600 disabled:dark:bg-zinc-700 disabled:dark:text-zinc-600 {{
    size()
  }}">
  <div
    class="flex items-center"
    [class.justify-between]="icon() && !gap()"
    [class.justify-center]="!icon() || gap()"
    [class]="gap()">
    <!-- Icon Left -->
    @if (icon() && iconPosition() === 'left') {
      <lucide-icon [img]="icon()" [size]="iconSize()" class="rtl:rotate-270" />
    }

    <span>{{ label() }}</span>

    <!-- Icon Right -->
    @if (icon() && iconPosition() === 'right') {
      <lucide-icon [img]="icon()" [size]="iconSize()" class="rtl:rotate-270" />
    }
  </div>
</button>
