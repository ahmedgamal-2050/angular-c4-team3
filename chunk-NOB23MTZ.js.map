<section
  class="bg-maroon-50 dark:bg-zinc-700 flex flex-wrap gap-4 justify-around items-center p-10 rounded-2xl mt-10"
>
  @for (item of features(); track item.id) {
    <div class="flex items-center gap-4">
      <span
        class="flex items-center justify-center size-15 rounded-full bg-maroon-600 dark:bg-soft-pink-200 text-white dark:text-zinc-800"
      >
        <lucide-icon [name]="item.icon" size="40" [strokeWidth]="1" />
      </span>

      <div class="flex flex-col gap-1">
        <h6
          class="text-xl font-semibold text-maroon-600 dark:text-soft-pink-200"
        >
          {{ item.title | transloco }}
        </h6>

        <p class="text-sm text-zinc-500 dark:text-zinc-300 font-normal">
          {{ item.description | transloco }}
        </p>
      </div>
    </div>
  }
</section>
