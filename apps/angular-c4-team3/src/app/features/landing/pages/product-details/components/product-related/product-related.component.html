<section class="px-6 py-10">
  <div class="my-4">
    <div class="mb-2.5">
      <app-styled-home-title [title]="'product_related' | transloco" />
    </div>
  </div>

  @if (products() && products().length) {
    <div class="slider">
      <app-slider [products]="products()" />
    </div>
  } @else {
    <p>{{ 'no_products_found' | transloco }}</p>
  }
</section>
