<div class="container mx-auto lg:px-20 py-8">
  <div class="flex flex-col lg:flex-row gap-8">
    <!-- Left Side: Cart Items -->
    <div class="flex-1">
      <app-stepper />
    </div>

    <!-- Right Side: Summary -->
    <div class="w-full lg:w-1/3">
      <app-cart-summary
        [subtotal]="subtotal()"
        [discountAmount]="discountPercentage()"
        [total]="total()"
        (checkout)="checkout()"
        (applyCoupon)="applyCoupon($event)"
        [showButton]="false" />
    </div>
  </div>

  @if (isLoggedIn() && userId()) {
    <app-product-may-like [userId]="userId()" />
  }
</div>
