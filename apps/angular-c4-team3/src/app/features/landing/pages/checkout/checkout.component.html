<div class="container mx-auto lg:px-20 py-8">
  <div class="flex flex-col lg:flex-row gap-8">
    <!-- Left Side: Cart Items -->
    <div class="flex-1">
      <div class="mx-auto p-6 min-h-screen">
        <app-stepper [currentActiveStep]="currentActiveStep()" />

        @if (currentActiveStep() === 1) {
          <app-shipping-address
            [addresses]="addresses()"
            (updateSelectedAddress)="selectedAddress.set($event)"
            (nextStep)="currentActiveStep.set(2)"
            (addAddress)="addAddress($event)"
            (updateAddressList)="getAllAddresses()" />
        } @else if (currentActiveStep() === 2) {
          <div class="flex gap-2">
            <button
              class="flex items-center gap-2 bg-zinc-100 rounded-xl text-zinc-800 text-sm h-10 font-semibold p-2.5 cursor-pointer"
              (click)="currentActiveStep.set(1)">
              <svg
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M10.0003 4.16699L4.16699 10.0003L10.0003 15.8337M4.16699 10.0003H15.8337"
                  stroke="#27272A"
                  stroke-width="1.45833"
                  stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>

              <span class="text-sm font-medium">
                {{ 'back' | transloco }}
              </span>
            </button>

            <h2
              class="text-3xl font-semibold text-zinc-800 dark:text-zinc-100 mb-8">
              {{ 'payment_method' | transloco }}
            </h2>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            @for (method of paymentMethodList(); track method.id) {
              <button
                (click)="selectedPayment.set(method.value)"
                type="button"
                [class.bg-zinc-200]="selectedPayment() === method.value"
                class="border border-zinc-200 rounded-2xl p-6 cursor-pointer transition hover:border-maroon-600">
                <div class="flex justify-center mb-6">
                  <img [src]="method.image" [alt]="method.name" />
                </div>

                <h3
                  [class.text-maroon-600]="selectedPayment() === method.value"
                  [class.text-zinc-800]="selectedPayment() !== method.value"
                  class="text-center text-2xl font-semibold mb-2">
                  {{ method.name | transloco }}
                </h3>

                <p class="text-center text-zinc-500 font-semibold text-sm">
                  {{ method.description | transloco }}
                </p>
              </button>
            }
          </div>

          <div class="flex justify-end mt-14">
            <shared-ui-button
              [label]="'checkout' | transloco"
              [type]="'submit'"
              [icon]="Ticket"
              (click)="checkout()"
              [disabled]="!selectedPayment()"
              iconPosition="right">
            </shared-ui-button>
          </div>
        }
      </div>
    </div>

    <!-- Right Side: Summary -->
    <div class="w-full lg:w-1/3">
      <app-cart-summary
        [subtotal]="subtotal()"
        [discountAmount]="discountPercentage()"
        [total]="total()"
        (checkout)="checkout()"
        (applyCoupon)="applyCoupon($event)"
        [showButton]="false" />
    </div>
  </div>

  @if (isLoggedIn() && userId()) {
    <app-product-may-like [userId]="userId()" />
  }
</div>
