<div class="container mx-auto lg:px-20 py-8">
  <div class="flex flex-col lg:flex-row gap-8">
    <!-- Left Side: Cart Items -->
    <div class="flex-1">
      <div class="mx-auto p-6 min-h-screen">
        <app-stepper [currentActiveStep]="currentActiveStep()" />

        @if (currentActiveStep() === 1) {
          <app-shipping-address (nextStep)="currentActiveStep.set(2)" />
        } @else if (currentActiveStep() === 2) {
          <p>Payment Method</p>
        }
      </div>
    </div>

    <!-- Right Side: Summary -->
    <div class="w-full lg:w-1/3">
      <app-cart-summary
        [subtotal]="subtotal()"
        [discountAmount]="discountPercentage()"
        [total]="total()"
        (checkout)="checkout()"
        (applyCoupon)="applyCoupon($event)"
        [showButton]="false" />
    </div>
  </div>

  @if (isLoggedIn() && userId()) {
    <app-product-may-like [userId]="userId()" />
  }
</div>
