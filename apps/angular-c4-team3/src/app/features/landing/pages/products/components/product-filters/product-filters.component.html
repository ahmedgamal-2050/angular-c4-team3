<!-- Sidebar Filters -->
<aside class="w-full md:w-[280px] flex-shrink-0 flex flex-col gap-6">

  <!-- Category Filter -->
  <div class="filter-section">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-bold text-zinc-800 text-lg dark:text-white">{{ 'Category' | transloco }}</h3>
      <button class="text-maroon-500 text-sm hover:text-maroon-600">
        Reset
      </button>
    </div>

    <div class="flex flex-col gap-2">
      @for (cat of categories(); track cat._id) {
        <button
          class="flex items-center gap-3 px-3 py-2 rounded-md transition-colors text-sm font-medium w-full"
          [class]="
            cat.selected
              ? 'bg-zinc-800 text-white'
              : 'bg-zinc-200 dark:bg-zinc-700 text-zinc-800 dark:text-white hover:bg-zinc-200 dark:hover:bg-zinc-600'
          "
        >
         
          <img
            [src]="cat.image"
            alt="category"
            class="w-6 h-6 rounded object-cover "
          />

          {{ cat.name }}
        </button>
      }
    </div>
  </div>

  <!-- Occasion Filter -->
  <div class="filter-section">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-bold text-zinc-800 text-lg dark:text-white">{{ 'Occasion' | transloco }}</h3>
      <button class="text-maroon-500 text-sm hover:text-maroon-600">
        {{ 'Reset' | transloco }}
      </button>
    </div>

    <div class="grid grid-cols-2 gap-2">
      @for (occ of occasions(); track occ._id) {
        <div
          class="relative h-[60px] rounded-lg overflow-hidden cursor-pointer group bg-zinc-600"
          [style.background-image]="'url(' + (occ.image ) + ')'"
          style="background-size: cover; background-position: center"
        >
          <div class="absolute inset-0 bg-black/50 group-hover:bg-black/40 transition-colors z-10"></div>

          <div class="absolute inset-0 flex items-center justify-center z-20">
            <span class="text-white text-xs font-semibold text-center px-1">
              {{ occ.name }}
            </span>
          </div>
        </div>
      }
    </div>
  </div>

  <!-- Rating Filter -->
  <div class="filter-section">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-bold text-zinc-800 text-lg">{{ 'Rating_only' | transloco }}</h3>
      <button class="text-maroon-500 text-sm hover:text-maroon-600">
        {{ 'Reset' | transloco }}
      </button>
    </div>

    <div class="flex items-center gap-1 ">
      <p-rating
      class="text-yellow-500"
        [(ngModel)]="ratingValue"
        [stars]="5"
        [pt]="ratingPassThrough()"
      ></p-rating>
    </div>
  </div>

  <!-- Price Filter -->
  <div class="filter-section mb-2">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-bold text-zinc-800 text-lg">{{ 'Price_only' | transloco }}</h3>

      <button class="text-maroon-500 text-sm hover:text-maroon-600">
       {{ 'Reset' | transloco }}
      </button>
    </div>

    <div class="flex items-center gap-4">
      <div class="flex-1">
        <label class="block text-zinc-600 text-sm mb-1">{{ 'from' | transloco }}</label>

        <input
          type="number"
          pInputText
          [(ngModel)]="priceFrom"
          placeholder="0"
          class="w-full border border-zinc-300 rounded-md p-2 text-sm"
        />
      </div>

      <div class="flex-1">
        <label class="block text-zinc-600 text-sm mb-1">{{ 'to' | transloco }}</label>

        <input
          type="number"
          pInputText
          [(ngModel)]="priceTo"
          placeholder="100000"
          class="w-full border border-zinc-300 rounded-md p-2 text-sm"
        />
      </div>
    </div>
  </div>

  <!-- Reset All -->
  <button
    class="w-full bg-maroon-50 dark:bg-maroon-700 dark:hover:bg-maroon-600 text-maroon-500 dark:text-white hover:bg-maroon-100 font-medium py-3 rounded-md transition-colors"
  >
    {{ 'Reset_All' | transloco }}
  </button>

</aside>
