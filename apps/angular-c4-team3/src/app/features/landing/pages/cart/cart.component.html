<div class="container mx-auto lg:px-4 py-8 max-w-7xl">
  <div class="flex flex-col lg:flex-row gap-8">
    <!-- Left Side: Cart Items -->
    <div class="flex-1">
      <app-product-items-section
        [title]="'cart_title' | transloco"
        [cartItems]="cartItems()"
        [cartCount]="cartCount()"
        (removeItem)="removeItem($event)"
        (updateQuantity)="updateQuantity($event)"
        (clearCart)="clearCart()" />
    </div>

    <!-- Right Side: Summary -->
    <div class="w-full lg:w-1/3">
      <app-cart-summary
        [subtotal]="subtotal()"
        [discountPercentage]="discountPercentage()"
        [total]="total()"
        (checkout)="checkout()"
        (applyCoupon)="applyCoupon($event)" />
    </div>
  </div>
</div>
