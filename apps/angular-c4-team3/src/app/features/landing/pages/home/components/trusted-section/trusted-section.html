<section class="bg-maroon-50  dark:bg-zinc-700 rounded-xl py-9">
<h4 class="text-maroon-700 dark:text-soft-pink-200 text-2xl font-bold text-center pb-3">Trusted by over <span class="dark:text-maroon-400 text-soft-pink-500">4.5k+</span> companies</h4>
<div class="flex justify-around">
    @for(image of images; track $index) {
        <div>
           <img [src]="image" alt="brand" class="h-12 object-contain">
        </div>
    }
</div>
</section>
