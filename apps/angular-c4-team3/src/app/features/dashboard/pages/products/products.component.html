<div class="flex flex-col gap-6 w-full max-w-7xl mx-auto p-4 md:p-6">
  <!-- Header Section -->
  <div
    class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
    <h1 class="text-2xl lg:text-3xl font-bold text-zinc-900 dark:text-white">
      All Products
    </h1>
    <button
      [routerLink]="AddProduct"
      class="inline-flex items-center gap-2 px-5 py-3 rounded-lg text-sm font-bold text-white bg-maroon-700 hover:bg-maroon-800 transition-colors shadow-md cursor-pointer">
      <lucide-icon [img]="Plus" size="18" />
      Add a new product
    </button>
  </div>

  <!-- Table Section -->
  <div
    class="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-100 dark:border-zinc-800 p-6 shadow-sm">
    <app-table
      [data]="products()"
      [columns]="tableColumns()"
      [loading]="loading()"
      [globalFilterFields]="['title', 'price', 'quantity', 'sold', 'rateAvg']"
      [rows]="10">
      <!-- Custom Price Template -->
      <ng-template [appTableCell]="'price'" let-row>
        <span class="font-medium text-zinc-700 dark:text-zinc-300">
          {{ row.price | number }} EGP
        </span>
      </ng-template>

      <!-- Custom Stock (Quantity) Template -->
      <ng-template [appTableCell]="'quantity'" let-row>
        @if (row.quantity <= 5) {
          <span class="text-red-600 dark:text-red-400 font-bold">
            {{ row.quantity }}
          </span>
        } @else {
          <span class="text-zinc-600 dark:text-zinc-400">
            {{ row.quantity | number }}
          </span>
        }
      </ng-template>

      <!-- Custom Sales (Sold) Template -->
      <ng-template [appTableCell]="'sold'" let-row>
        <span class="text-zinc-600 dark:text-zinc-400">
          {{ row.sold | number }}
        </span>
      </ng-template>

      <!-- Custom Ratings Template -->
      <ng-template [appTableCell]="'rateAvg'" let-row>
        <div class="flex items-center gap-1.5">
          <span class="font-bold text-zinc-800 dark:text-zinc-200">
            {{ row.rateAvg | number: '1.1-1' }}/5
          </span>
          <span class="text-zinc-400 dark:text-zinc-500 text-xs">
            ({{ row.rateCount }})
          </span>
        </div>
      </ng-template>

      <!-- Custom Actions Template -->
      <ng-template [appTableCell]="'actions'" let-row>
        <div class="flex items-center gap-2.5">
          <button
            [routerLink]="['/dashboard/products/edit', row._id]"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-50 text-blue-700 hover:bg-blue-100/80 dark:bg-blue-950/30 dark:text-blue-400 dark:hover:bg-blue-900/30 border border-blue-200/40 dark:border-blue-800/30 transition-colors duration-150 cursor-pointer">
            <lucide-icon [img]="Pencil" size="14" />
            Edit
          </button>
          <button
            (click)="deleteProduct(row._id)"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-50 text-red-700 hover:bg-red-100/80 dark:bg-red-950/30 dark:text-red-400 dark:hover:bg-red-900/30 border border-red-200/40 dark:border-red-800/30 transition-colors duration-150 cursor-pointer">
            <lucide-icon [img]="Trash2" size="14" />
            Delete
          </button>
        </div>
      </ng-template>
    </app-table>
  </div>
</div>
