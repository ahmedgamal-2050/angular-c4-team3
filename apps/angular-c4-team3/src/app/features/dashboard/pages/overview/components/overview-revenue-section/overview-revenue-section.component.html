<section
  class="bg-white rounded-lg p-4 lg:p-6 border border-zinc-100 flex flex-col h-full shadow-[0_4px_30px_rgba(0,0,0,0.03)]">
  <div class="flex items-center justify-between mb-8">
    <h4 class="font-bold text-zinc-900 text-lg lg:text-xl">
      {{ 'overview_revenue_section_title' | transloco }}
    </h4>

    <div class="flex items-center gap-4 text-sm font-bold">
      <button
        type="button"
        (click)="activeTab.set('monthly')"
        [class.text-red-800]="activeTab() === 'monthly'"
        [class.text-zinc-400]="activeTab() !== 'monthly'"
        class="transition-colors duration-200 cursor-pointer">
        {{ 'overview_revenue_section_monthly' | transloco }}
      </button>

      <button
        type="button"
        (click)="activeTab.set('weekly')"
        [class.text-red-800]="activeTab() === 'weekly'"
        [class.text-zinc-400]="activeTab() !== 'weekly'"
        class="transition-colors duration-200 cursor-pointer">
        {{ 'overview_revenue_section_last_week' | transloco }}
      </button>
    </div>
  </div>

  <div class="w-full grow h-72 relative">
    <p-chart
      type="line"
      [data]="chartData()"
      [options]="chartOptions()"
      [plugins]="chartPlugins()"
      class="w-full h-full" />
  </div>
</section>
