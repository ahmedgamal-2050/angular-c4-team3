<section class="grid grid-cols-2 gap-4 lg:bg-white lg:p-6 lg:rounded-xl">
  @for (card of overallCards(); track card.title) {
    <div
      class="flex flex-col gap-3 rounded-lg p-4"
      [class]="card.backgroundClass">
      <lucide-icon [name]="card.icon" [class]="card.textClass" />

      <div>
        <p class="text-lg font-semibold mb-1" [class]="card.textClass">
          {{ card.value }}
        </p>

        <p class="text-sm font-medium text-zinc-800">
          {{ card.title | transloco }}
        </p>
      </div>
    </div>
  }
</section>
