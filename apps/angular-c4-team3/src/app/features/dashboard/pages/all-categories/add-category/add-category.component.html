<section
  class="min-h-screen bg-gray-50 dark:bg-zinc-900 p-6 flex justify-center">
  <div class="w-full max-w-2xl">
    <h2 class="text-xl font-bold text-zinc-900 dark:text-zinc-100 mb-6">
      Add a New Category
    </h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <!-- Name -->
      <app-input
        id="name"
        type="text"
        label="Name"
        placeholder="Enter category name"
        [required]="true"
        fieldControlName="name"
        [errorMessages]="nameErrors()" />

      <!-- Image -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-zinc-700 dark:text-zinc-300">
          Category image <span class="text-red-600">*</span>
        </label>
        <label
          for="categoryImage"
          class="flex items-center justify-end gap-2 px-4 py-2.5 rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 cursor-pointer hover:border-red-400 transition">
          <span
            class="text-sm text-zinc-400 dark:text-zinc-500 flex-1 truncate">
            {{ selectedFile()?.name ?? '' }}
          </span>
          <span
            class="flex items-center gap-1 text-sm text-red-700 dark:text-red-400 font-medium">
            <svg
              class="w-4 h-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 12V4m0 0L9 7m3-3l3 3" />
            </svg>
            Upload file
          </span>
        </label>
        <input
          id="categoryImage"
          type="file"
          accept="image/*"
          class="hidden"
          (change)="onFileSelected($event)" />
      </div>

      <shared-ui-button
        [label]="'Add Category'"
        [type]="'submit'"
        [disabled]="form.invalid" />
    </form>
  </div>
</section>
