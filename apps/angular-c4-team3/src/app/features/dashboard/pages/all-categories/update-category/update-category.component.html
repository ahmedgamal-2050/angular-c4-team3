<section
  class="min-h-screen bg-gray-50 dark:bg-zinc-900 p-6 flex justify-center items-start">
  <div class="w-full max-w-2xl">
    <h2 class="text-xl font-bold text-zinc-900 dark:text-zinc-100 mb-6">
      Update Category: {{ categoryName() }}
    </h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <!-- Name -->
      <app-input
        id="name"
        type="text"
        label="Name"
        placeholder="Enter category name"
        [required]="true"
        fieldControlName="name"
        [errorMessages]="nameErrors()" />

      <!-- View existing image -->
      @if (existingImageUrl()) {
        <div class="flex items-center justify-end">
          <a
            [href]="existingImageUrl()!"
            target="_blank"
            class="flex items-center gap-1 text-sm text-blue-600 dark:text-blue-400 hover:underline">
            <svg
              class="w-4 h-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            View category image
          </a>
        </div>
      }

      <shared-ui-button
        [label]="'Update Category'"
        [type]="'submit'"
        [disabled]="form.invalid" />
    </form>
  </div>
</section>
