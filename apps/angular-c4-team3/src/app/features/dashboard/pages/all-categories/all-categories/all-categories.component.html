<section class="min-h-screen bg-gray-50 dark:bg-zinc-900 p-6">
  <div class="w-full max-w-5xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-bold text-zinc-900 dark:text-zinc-100">
        All Categories
      </h2>
      <shared-ui-button
        [label]="'+ Add a new category'"
        [type]="'button'"
        (click)="navigateToAdd()" />
    </div>

    <!-- Table -->
    <app-table
      [data]="categories()"
      [columns]="columns"
      [globalFilterFields]="['name']"
      [rows]="limit"
      [loading]="loading()"
      [cellTemplates]="[nameTpl, productsTpl, actionsTpl]">
      <ng-template #nameTpl let-row="row">
        {{ row.name }}
      </ng-template>

      <ng-template #productsTpl let-row="row">
        {{ row.productsCount }}
      </ng-template>

      <ng-template #actionsTpl let-row="row">
        <div class="flex items-center justify-end gap-2">
          <button
            type="button"
            class="flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-700 rounded-lg hover:bg-blue-50 dark:hover:bg-blue-900/30 transition"
            (click)="onEdit(row)">
            <svg
              class="w-3.5 h-3.5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
            Edit
          </button>
          <button
            type="button"
            class="flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-red-600 dark:text-red-400 border border-red-200 dark:border-red-700 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/30 transition"
            (click)="onDelete(row)">
            <svg
              class="w-3.5 h-3.5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            Delete
          </button>
        </div>
      </ng-template>
    </app-table>
  </div>

  @if (showDeleteModal()) {
    <app-confirm-delete-modal
      (confirmed)="onDeleteConfirmed()"
      (cancelled)="showDeleteModal.set(false)" />
  }
</section>
