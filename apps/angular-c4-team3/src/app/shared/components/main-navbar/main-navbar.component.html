<nav class="bg-maroon-700 dark:bg-soft-pink-200 text-white dark:text-zinc-800">
  <div class="container mx-auto px-4">
    <ul class="flex flex-wrap items-center justify-center gap-4">
      @for (item of navItems(); track item.label) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="text-soft-pink-200 dark:text-maroon-800 border-b-2 border-soft-pink-200 dark:border-maroon-800"
            class="flex items-center p-2 md:p-3 gap-1 md:gap-2 group transition-all duration-300 hover:text-soft-pink-200 dark:hover:text-maroon-700"
          >
            <lucide-icon
              [name]="item.icon"
              size="20"
              class="group-hover:scale-110 transition-transform"
            />
            <span class="font-medium tracking-wide lg:block hidden">
              {{ item.label | transloco }}
            </span>
          </a>
        </li>
      }
    </ul>
  </div>
</nav>
