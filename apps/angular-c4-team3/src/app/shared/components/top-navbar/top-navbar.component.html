<nav class="bg-white dark:bg-zinc-800 border-b border-zinc-100 dark:border-zinc-700 py-3 shadow-sm">
  <div class="container mx-auto px-4 flex items-center justify-between gap-4">
    <!-- Logo -->
    <div class="flex items-center">
      <div class="flex flex-col items-center">
        <img src="assets/images/rose-app-logo.webp" alt="logo" class="h-20 w-22">
      </div>
    </div>

    <!-- Location -->
    @if(isLoggedIn()) {
      <div class="hidden lg:flex flex-col gap-1 text-sm">
        <div class="text-zinc-400 dark:text-zinc-500">{{ 'landing_top_navbar_section_deliver_to' | transloco }}:</div>
        <div class="flex items-center gap-1 font-semibold text-maroon-700 dark:text-soft-pink-200">
          <lucide-icon [name]="MapPin" size="18"/>
          <span>{{ location() }}</span>
        </div>
      </div>
    }

    <!-- Search Bar -->
    <div class="flex-1 max-w-2xl relative">
      <input
        type="text"
        [placeholder]="'landing_top_navbar_section_search_placeholder' | transloco"
        class="w-full ps-12 pe-4 py-2 bg-zinc-50 border border-zinc-200 dark:border-zinc-600 rounded-lg focus:border-maroon-300 transition-colors dark:placeholder:text-zinc-500 dark:bg-zinc-700"
        (input)="updateSearch($event)"
      />
      <lucide-icon
        [name]="Search"
        size="20"
        class="absolute start-3 top-1/2 -translate-y-1/2 text-zinc-400 dark:text-zinc-500"
      />
    </div>

    <!-- Right Side Actions -->
    <div class="flex items-center gap-6">
      <!-- User Profile -->
      <app-user-dropdown />

      <div class="h-8 w-px bg-zinc-200 dark:bg-zinc-700 hidden md:block"></div>

      <!-- Icons -->
      <div class="flex items-center gap-5">
        <app-navbar-action-button [icon]="Heart" />

        <app-navbar-action-button [icon]="ShoppingCart" [count]="cartCount()" />

        <app-navbar-action-button [icon]="Bell" [count]="notificationCount()" />
      </div>

      <div class="h-8 w-px bg-zinc-200 dark:bg-zinc-700 hidden md:block"></div>

      <!-- Language -->
      <div class="flex items-center gap-2">
        <app-lang-switcher />

        <app-theme-switcher />
      </div>
    </div>
  </div>
</nav>
