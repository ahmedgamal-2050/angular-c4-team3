@if (type() === 'action') {
  <button
    type="button"
    (click)="handleAction()"
    class="text-zinc-800 dark:text-white hover:text-maroon-600 transition-colors relative">
    <ng-container [ngTemplateOutlet]="contentTemplate" />
  </button>
} @else {
  <a
    [routerLink]="link()"
    class="text-zinc-800 dark:text-white hover:text-maroon-600 transition-colors relative">
    <ng-container [ngTemplateOutlet]="contentTemplate" />
  </a>
}

<ng-template #contentTemplate>
  <lucide-icon [name]="icon()" class="size-5 lg:size-6" />

  @if (count() > 0) {
    <span
      class="absolute -top-2 -end-1 bg-red-600 dark:bg-red-500 text-white text-[0.625rem] w-4 h-4 rounded-full flex items-center justify-center">
      {{ count() }}
    </span>
  }
</ng-template>
