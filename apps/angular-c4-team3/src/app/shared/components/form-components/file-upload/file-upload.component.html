<div class="flex flex-col gap-1.5 w-full">
  <!-- Label -->
  @if (label()) {
    <app-label
      [text]="label()"
      [for]="id()"
      [disabled]="disabled()"
      [required]="required()"
      [error]="!!errorMessages()?.length" />
  }

  <!-- PrimeNG FileUpload component -->
  <p-fileUpload
    #pUpload
    [accept]="accept()"
    [multiple]="multiple()"
    [disabled]="disabled()"
    [auto]="true"
    customUpload="true"
    (onSelect)="onSelect($event)"
    [pt]="fileuploadPt()">
    <ng-template #content let-choose="chooseCallback">
      <div
        (click)="choose()"
        class="flex items-center justify-between w-full h-11 px-3 border border-zinc-200 dark:border-zinc-700 rounded-lg bg-zinc-50 dark:bg-zinc-800 hover:border-maroon-300 dark:hover:border-zinc-650 transition-colors cursor-pointer select-none">
        
        <!-- File Name Display / Placeholder -->
        <div class="text-xs truncate pr-4 text-zinc-500 dark:text-zinc-400">
          @if (fileNameDisplay()) {
            <span class="font-medium text-zinc-800 dark:text-zinc-200">{{ fileNameDisplay() }}</span>
          } @else {
            <span class="text-zinc-400 dark:text-zinc-500">{{ placeholder() }}</span>
          }
        </div>

        <!-- Upload Action Button -->
        <div class="flex items-center gap-1.5 text-red-600 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300 transition-colors shrink-0">
          <lucide-icon [img]="UploadIcon" size="16" />
          <span class="text-xs font-bold">Upload file</span>
        </div>
      </div>
    </ng-template>
  </p-fileUpload>

  <!-- Previews list -->
  @if (previewUrls().length > 0) {
    <div class="flex flex-wrap gap-2 mt-1">
      @for (url of previewUrls(); track url) {
        <div class="relative">
          <img
            [src]="url"
            class="h-12 w-12 object-cover rounded-md border border-zinc-200 dark:border-zinc-700 shadow-2xs" />
        </div>
      }
    </div>
  }

  <!-- Error Validation Messages -->
  @if (errorMessages()?.length) {
    <div class="flex flex-col gap-1 mt-1 text-xs text-red-500 font-medium">
      @for (message of errorMessages(); track message) {
        <span>{{ message }}</span>
      }
    </div>
  }
</div>
