<div
  class="bg-white dark:bg-zinc-800 rounded-2xl border border-zinc-200 dark:border-zinc-700 overflow-hidden">
  <table class="w-full text-sm">
    <thead>
      <tr class="border-b border-zinc-100 dark:border-zinc-700">
        @for (col of columns(); track col.key) {
          <th
            class="text-left px-6 py-3 text-zinc-500 dark:text-zinc-400 font-medium">
            {{ col.label }}
          </th>
        }
        <th class="px-6 py-3"></th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row._id) {
        <tr
          class="border-b border-zinc-50 dark:border-zinc-700 hover:bg-zinc-50 dark:hover:bg-zinc-700/40 transition">
          @for (col of columns(); track col.key) {
            <td class="px-6 py-4 text-zinc-800 dark:text-zinc-100">
              {{ row[col.key] }}
            </td>
          }
          <td class="px-6 py-4">
            <div class="flex items-center justify-end gap-2">
              <button
                type="button"
                class="flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-700 rounded-lg hover:bg-blue-50 dark:hover:bg-blue-900/30 transition"
                (click)="editClick.emit(row)">
                <svg
                  class="w-3.5 h-3.5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
                Edit
              </button>
              <button
                type="button"
                class="flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-maroon-600 dark:text-maroon-400 border border-maroon-200 dark:border-maroon-600 rounded-lg hover:bg-maroon-50 dark:hover:bg-maroon-900/30 transition"
                (click)="deleteClick.emit(row)">
                <svg
                  class="w-3.5 h-3.5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                Delete
              </button>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
