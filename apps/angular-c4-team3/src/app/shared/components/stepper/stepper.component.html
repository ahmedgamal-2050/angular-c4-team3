<div class=" mx-auto p-6  min-h-screen">
  <!-- Progress -->
  <div class="mb-5">
    <div class="relative flex items-center justify-between">
      <!-- line -->
      <div class="absolute top-1/2 left-0 w-full h-1 bg-zinc-200 -translate-y-1/2"></div>

      <!-- active line -->
      <div class="absolute top-1/2 left-0 w-[33%] h-1 bg-maroon-600 -translate-y-1/2"></div>

      <div class="relative z-10  text-zinc-500 text-sm flex items-center justify-center">

      </div>
      <!-- step 1 -->
      <div class="relative z-10 w-7 h-7 rounded-full bg-maroon-600 text-white text-sm flex items-center justify-center">
        1
      </div>

      <!-- step 2 -->
      <div
        class="relative z-10 w-7 h-7 rounded-full bg-zinc-200 text-zinc-500 text-sm flex items-center justify-center">
        2
      </div>
      <div class="relative z-10  text-zinc-500 text-sm flex items-center justify-center">

      </div>
    </div>
  </div>

  <!-- title -->
  <h2 class="text-3xl font-semibold text-zinc-800 dark:text-zinc-100 mb-8">
    {{'shipping_address' | transloco}}
  </h2>

  <!-- Address Card -->
  <div class="space-y-4">
    <!-- card -->
    <div class="border border-zinc-300 rounded-2xl p-4 flex items-start justify-between">
      <div>
        <h3 class="text-2xl font-semibold text-zinc-800 dark:text-zinc-100 mb-2">Giza</h3>

        <span
          class="inline-block bg-zinc-100 text-zinc-800  text-base font-medium  px-4 py-1 rounded-full">
          21 Ahmed Mohamed St., King Faisal St., Giza
        </span>
      </div>

      <div class="flex items-center gap-2 text-zinc-500">
        <div class="w-10 h-10 rounded-full bg-maroon-600 text-white flex items-center justify-center">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path

              stroke="white" stroke-width="1.45833" stroke-linecap="round" stroke-linejoin="round" />
          </svg>

        </div>

        <span class="text-lg font-medium">+201012346578</span>
      </div>
    </div>

    <!-- active card -->
    <div class="border bg-maroon-600 rounded-2xl p-4 flex items-start justify-between">
      <div>
        <h3 class="text-2xl font-semibold text-zinc-50 mb-2">Cairo</h3>

        <span class="inline-block text-zinc-100 bg-zinc-800 text-base font-medium  px-4 py-1 rounded-full">
          14 Omar Ibn Akhatab St., Ramsis St., Cairo
        </span>
      </div>

      <div class="flex items-center gap-2 text-zinc-50">
        <div class="w-10 h-10 rounded-full text-maroon-600 bg-white flex items-center justify-center">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M11.527 13.807C11.6991 13.886 11.893 13.9041 12.0767 13.8582C12.2605 13.8123 12.4231 13.7052 12.5378 13.5545L12.8337 13.167C12.9889 12.96 13.1902 12.792 13.4216 12.6763C13.6531 12.5606 13.9083 12.5003 14.167 12.5003H16.667C17.109 12.5003 17.5329 12.6759 17.8455 12.9885C18.1581 13.301 18.3337 13.725 18.3337 14.167V16.667C18.3337 17.109 18.1581 17.5329 17.8455 17.8455C17.5329 18.1581 17.109 18.3337 16.667 18.3337C12.6887 18.3337 8.87344 16.7533 6.06039 13.9403C3.24734 11.1272 1.66699 7.31191 1.66699 3.33366C1.66699 2.89163 1.84259 2.46771 2.15515 2.15515C2.46771 1.84259 2.89163 1.66699 3.33366 1.66699H5.83366C6.27569 1.66699 6.69961 1.84259 7.01217 2.15515C7.32473 2.46771 7.50033 2.89163 7.50033 3.33366V5.83366C7.50033 6.0924 7.44008 6.34759 7.32437 6.57901C7.20866 6.81044 7.04065 7.01175 6.83366 7.16699L6.44366 7.45949C6.29067 7.57631 6.18284 7.74248 6.13848 7.92978C6.09413 8.11709 6.11598 8.31397 6.20033 8.48699C7.33923 10.8002 9.21235 12.671 11.527 13.807Z"
              stroke="#A6252A" stroke-width="1.45833" stroke-linecap="round" stroke-linejoin="round" />
          </svg>


        </div>

        <span class="text-lg font-medium">+201012346578</span>
      </div>
    </div>

    <!-- card -->
    <div class="border border-zinc-300 rounded-2xl p-4 flex items-start justify-between">
      <div>
        <h3 class="text-2xl font-semibold text-zinc-800 dark:text-zinc-100 mb-2">Alexandria</h3>

        <span
          class="inline-block bg-zinc-100 text-zinc-800   text-base font-medium  px-4 py-1 rounded-full">
          16 El-Gaish Rd, San Stefano, El-Raml 2, Alexandria
        </span>
      </div>

      <div class="flex items-center gap-2 text-zinc-500">
        <div class="w-10 h-10 rounded-full bg-maroon-600 text-white flex items-center justify-center">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M11.527 13.807C11.6991 13.886 11.893 13.9041 12.0767 13.8582C12.2605 13.8123 12.4231 13.7052 12.5378 13.5545L12.8337 13.167C12.9889 12.96 13.1902 12.792 13.4216 12.6763C13.6531 12.5606 13.9083 12.5003 14.167 12.5003H16.667C17.109 12.5003 17.5329 12.6759 17.8455 12.9885C18.1581 13.301 18.3337 13.725 18.3337 14.167V16.667C18.3337 17.109 18.1581 17.5329 17.8455 17.8455C17.5329 18.1581 17.109 18.3337 16.667 18.3337C12.6887 18.3337 8.87344 16.7533 6.06039 13.9403C3.24734 11.1272 1.66699 7.31191 1.66699 3.33366C1.66699 2.89163 1.84259 2.46771 2.15515 2.15515C2.46771 1.84259 2.89163 1.66699 3.33366 1.66699H5.83366C6.27569 1.66699 6.69961 1.84259 7.01217 2.15515C7.32473 2.46771 7.50033 2.89163 7.50033 3.33366V5.83366C7.50033 6.0924 7.44008 6.34759 7.32437 6.57901C7.20866 6.81044 7.04065 7.01175 6.83366 7.16699L6.44366 7.45949C6.29067 7.57631 6.18284 7.74248 6.13848 7.92978C6.09413 8.11709 6.11598 8.31397 6.20033 8.48699C7.33923 10.8002 9.21235 12.671 11.527 13.807Z"
              stroke="white" stroke-width="1.45833" stroke-linecap="round" stroke-linejoin="round" />
          </svg>

        </div>

        <span class="text-lg font-medium">+201012346578</span>
      </div>
    </div>
  </div>

  <!-- OR -->
  <div class="flex items-center gap-4 my-8">
    <div class="flex-1 h-px bg-zinc-200"></div>

    <span class="text-zinc-500 font-semibold">OR</span>

    <div class="flex-1 h-px bg-zinc-200"></div>
  </div>

  <!-- Add Address -->
  <button class="w-full py-5 rounded-2xl bg-rose-50 text-maroon-600 font-semibold hover:bg-rose-100 transition">
    {{'add_address' | transloco}}
  </button>

  <!-- Next Button -->
  <div class="flex justify-end mt-14">
    <shared-ui-button [label]="'next' | transloco" [type]="'submit'" (clicked)="submit()" [icon]="Ticket"
      iconPosition="right"></shared-ui-button>
  </div>
</div>
