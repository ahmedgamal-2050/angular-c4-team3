<div class="slider">
  <p-carousel
    [value]="products()"
    [numVisible]="numVisible()"
    [numScroll]="1"
    [responsiveOptions]="responsiveOptions"
    [circular]="true"
  >
    <ng-template pTemplate="item" let-product>
      <div class="p-3">
        <app-product-card [product]="product"></app-product-card>
      </div>
    </ng-template>
  </p-carousel>
</div>
