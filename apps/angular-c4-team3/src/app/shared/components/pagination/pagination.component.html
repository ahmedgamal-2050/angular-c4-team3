<div class="flex items-center justify-center gap-1 mt-6">
  <button
    type="button"
    class="px-2 py-1 text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-100 disabled:opacity-30 transition"
    [disabled]="currentPage() === 1"
    (click)="goToPage(1)">
    «
  </button>

  <button
    type="button"
    class="px-2 py-1 text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-100 disabled:opacity-30 transition"
    [disabled]="currentPage() === 1"
    (click)="goToPage(currentPage() - 1)">
    ‹
  </button>

  @for (page of pages(); track page) {
    @if (
      page === 1 ||
      page === totalPages() ||
      (page >= currentPage() - 1 && page <= currentPage() + 1)
    ) {
      <button
        type="button"
        class="w-8 h-8 rounded-lg text-sm font-medium transition"
        [class]="
          page === currentPage()
            ? 'bg-maroon-600 text-white'
            : 'text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-700'
        "
        (click)="goToPage(page)">
        {{ page }}
      </button>
    } @else if (page === currentPage() - 2 || page === currentPage() + 2) {
      <span class="w-8 h-8 flex items-center justify-center text-zinc-400"
        >...</span
      >
    }
  }

  <button
    type="button"
    class="px-2 py-1 text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-100 disabled:opacity-30 transition"
    [disabled]="currentPage() === totalPages()"
    (click)="goToPage(currentPage() + 1)">
    ›
  </button>

  <button
    type="button"
    class="px-2 py-1 text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-100 disabled:opacity-30 transition"
    [disabled]="currentPage() === totalPages()"
    (click)="goToPage(totalPages())">
    »
  </button>
</div>
