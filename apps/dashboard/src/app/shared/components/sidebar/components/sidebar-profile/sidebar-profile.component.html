<div class="relative lg:mt-auto lg:border-t border-zinc-200 lg:pt-4">
  <!-- Profile details wrapper -->
  <button
    type="button"
    (click)="toggleDropdown()"
    class="flex items-center gap-3 rounded-xl transition-colors duration-200 cursor-pointer select-none">
    <img
      [src]="user()?.photo || 'assets/images/default-avatar.svg'"
      alt="Profile avatar"
      class="size-10 lg:size-13 rounded-full object-cover border border-zinc-200 shrink-0" />

    <div class="flex-1 min-w-0 text-start hidden lg:block">
      <h4 class="text-sm font-bold text-zinc-800 truncate">
        @if (user() && (user()?.firstName || user()?.lastName)) {
          {{ user()?.firstName }} {{ user()?.lastName }}
        }
      </h4>

      <p class="text-xs font-semibold text-zinc-500 truncate">
        {{ user()?.email }}
      </p>
    </div>

    <!-- Dropdown Trigger Button -->
    <button
      (click)="$event.stopPropagation(); toggleDropdown()"
      class="lg:p-1 rounded-lg text-zinc-400 lg:hover:text-zinc-600 lg:hover:bg-zinc-100 transition-colors shrink-0"
      type="button">
      <lucide-icon
        [img]="MoreVertical"
        size="18"
        class="hidden lg:inline-block" />
      <lucide-icon
        [img]="Menu"
        size="24"
        class="size-6 inline-block lg:hidden" />
    </button>
  </button>

  <!-- Dropdown Menu -->
  @if (isDropdownOpen()) {
    <div
      class="absolute w-40 lg:w-auto top-14 lg:top-auto lg:bottom-16 inset-e-0 lg:inset-x-4 bg-white border border-zinc-200 rounded-xl shadow-lg py-1 z-50 animate-in fade-in slide-in-from-top-2 lg:slide-in-from-bottom-2 duration-150">
      <button
        (click)="goToProfile()"
        class="flex w-full items-center gap-2.5 px-4 py-2.5 text-sm text-zinc-700 hover:bg-zinc-50 transition-colors text-start cursor-pointer font-semibold">
        <lucide-icon [img]="Settings" size="16" class="text-zinc-400" />
        {{ 'sidebar_profile_settings' | transloco }}
      </button>

      <div class="border-t border-zinc-100 my-1"></div>

      <button
        (click)="logout()"
        class="flex w-full items-center gap-2.5 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors text-start cursor-pointer font-semibold">
        <lucide-icon [img]="LogOut" size="16" class="text-red-400" />
        {{ 'sidebar_logout' | transloco }}
      </button>
    </div>
  }
</div>
