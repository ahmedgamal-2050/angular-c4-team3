<section
  class="min-h-screen bg-gray-50 dark:bg-zinc-900 p-6 flex justify-center items-start">
  <div class="w-full max-w-2xl">
    <h2 class="text-xl font-bold text-zinc-900 dark:text-zinc-100 mb-6">
      {{
        isEditMode()
          ? 'Update ' + entityLabel() + ': ' + entityName()
          : 'Add a New ' + entityLabel()
      }}
    </h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <app-input
        id="name"
        type="text"
        label="Name"
        [placeholder]="'Enter ' + entityLabel().toLowerCase() + ' name'"
        [required]="true"
        fieldControlName="name"
        [errorMessages]="nameErrors()" />

      <!-- Image upload (add mode only) -->
      <div [hidden]="isEditMode()" class="flex flex-col gap-1">
        <label class="text-sm font-medium text-zinc-700 dark:text-zinc-300">
          {{ entityLabel() }} image
          <span class="text-red-600">*</span>
        </label>
        <label
          for="entityImage"
          class="flex items-center justify-end gap-2 px-4 py-2.5 rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 cursor-pointer hover:border-red-400 transition">
          <span class="text-sm text-zinc-400 dark:text-zinc-500 flex-1 truncate">
            {{ selectedFile()?.name ?? '' }}
          </span>
          <span
            class="flex items-center gap-1 text-sm text-red-700 dark:text-red-400 font-medium">
            <svg
              class="w-4 h-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 12V4m0 0L9 7m3-3l3 3" />
            </svg>
            Upload file
          </span>
        </label>
        <input
          id="entityImage"
          type="file"
          accept="image/*"
          class="hidden"
          (change)="onFileSelected($event)" />
      </div>

      <!-- View existing image (edit mode only) -->
      @if (isEditMode() && existingImageUrl()) {
        <div class="flex items-center justify-end">
          <button
            type="button"
            (click)="openImageModal()"
            class="text-blue-600 dark:text-blue-400 hover:underline">
            <svg
              class="w-4 h-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            View current image
          </button>
        </div>
      }

      <shared-ui-button
        [label]="isEditMode() ? 'Update ' + entityLabel() : 'Add ' + entityLabel()"
        [type]="'submit'"
        [disabled]="form.invalid" />
    </form>
  </div>
</section>

<p-dialog
  [modal]="true"
  [closeOnEscape]="true"
  [visible]="isImageModalOpened()"
  (visibleChange)="isImageModalOpened.set($event)"
  [pt]="dialogPt"
  [style]="{ width: '40rem' }">
  <img
    [src]="existingImageUrl()!"
    alt="Current image"
    class="w-full rounded-xl object-contain max-h-96 mt-6" />
</p-dialog>
