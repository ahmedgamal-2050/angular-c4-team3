<section class="min-h-screen bg-gray-50 dark:bg-zinc-900 p-6">
  <div class="w-full max-w-5xl mx-auto">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-bold text-zinc-900 dark:text-zinc-100">
        All {{ entityLabel() }}s
      </h2>
      <shared-ui-button
        [label]="'+ Add a new ' + entityLabel().toLowerCase()"
        [type]="'button'"
        (click)="navigateToAdd()" />
    </div>

    <app-table
      [data]="items()"
      [columns]="columns"
      [globalFilterFields]="['name']"
      [rows]="limit"
      [loading]="loading()"
      [cellTemplates]="[nameTpl, productsTpl]"
      (delete)="onDelete($event)"
      (navigateToEdit)="onEdit($event)">
      <ng-template #nameTpl let-row="row">
        {{ row.name }}
      </ng-template>

      <ng-template #productsTpl let-row="row">
        {{ row.productsCount }}
      </ng-template>
    </app-table>
  </div>

  @if (showDeleteModal()) {
    <app-confirm-delete-modal
      (confirmed)="onDeleteConfirmed()"
      (cancelled)="showDeleteModal.set(false)" />
  }
</section>
