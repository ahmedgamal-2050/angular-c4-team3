<section
  class="bg-white rounded-lg p-4 lg:p-6 border border-zinc-100 flex flex-col h-full shadow-[0_4px_30px_rgba(0,0,0,0.03)]">
  <h4 class="font-bold text-zinc-900 text-lg lg:text-xl mb-6">
    {{ 'overview_low_stock_products_title' | transloco }}
  </h4>

  <div class="flex flex-col overflow-y-auto max-h-105 pr-1 scrollbar-thin">
    @for (product of lowStockProducts(); track product._id) {
      <div
        class="flex items-center justify-between py-3 border-b border-zinc-100 last:border-b-0 px-2 hover:bg-zinc-50/50 transition-colors duration-150 rounded-md">
        <div
          class="text-zinc-800 text-xs lg:text-sm font-semibold truncate max-w-[70%]">
          {{ product.title }}
        </div>

        <div
          class="text-xs lg:text-sm font-bold"
          [class.text-red-600]="(product.quantity ?? 0) <= 5"
          [class.text-zinc-800]="(product.quantity ?? 0) > 5">
          {{ product.quantity ?? 0 }}
          <span class="text-xs font-semibold ml-1">
            {{ 'overview_products' | transloco }}
          </span>
        </div>
      </div>
    }
  </div>
</section>
