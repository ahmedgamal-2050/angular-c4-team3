<section class="bg-white rounded-lg p-4 lg:p-6">
  <h4
    class="font-bold lg:font-semibold text-lg lg:text-xl mb-10 lg:text-center">
    {{ 'overview_order_status_section_title' | transloco }}
  </h4>

  <div
    class="flex lg:flex-col items-center justify-between w-full gap-4 lg:gap-9">
    <p-chart
      type="doughnut"
      [data]="data()"
      [options]="options()"
      class="w-[calc(100%-11rem)]" />

    <div class="w-40">
      @for (item of orderStatusChart(); track item.status) {
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-1">
            <span
              class="size-2 rounded-full"
              [class.bg-blue-500]="item.status === 'pending'"
              [class.bg-emerald-600]="item.status === 'completed'"
              [class.bg-red-600]="item.status === 'inProgress'"></span>

            <span class="font-semibold text-zinc-800 text-xs">
              {{ item.status }}
            </span>
          </div>

          <span class="font-bold text-zinc-800 text-xs">
            {{ item.count }} ({{ item.percentage }}%)
          </span>
        </div>
      }
    </div>
  </div>
</section>
