<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
  <div
    class="relative bg-white dark:bg-zinc-800 rounded-2xl shadow-xl w-full max-w-sm p-8 flex flex-col items-center gap-4">

    <!-- Close -->
    <button type="button"
      class="absolute top-4 right-4 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 transition"
      (click)="cancelled.emit()">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
        stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Icon -->
    <svg width="110" height="110" viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="55.5" cy="54.5" r="52.5" fill="#2E2E30" fill-opacity="0.05" />
      <circle cx="55" cy="55" r="35" fill="#2E2E30" fill-opacity="0.15" />
      <path
        d="M44.625 47.7503H66.375M63.9583 47.7503V64.667C63.9583 65.8753 62.75 67.0837 61.5417 67.0837H49.4583C48.25 67.0837 47.0417 65.8753 47.0417 64.667V47.7503M50.6667 47.7503V45.3337C50.6667 44.1253 51.875 42.917 53.0833 42.917H57.9167C59.125 42.917 60.3333 44.1253 60.3333 45.3337V47.7503"
        stroke="#2E2E30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>


    <!-- Text -->
    <div class="text-center">
      <p class="font-bold text-zinc-900 dark:text-zinc-100 text-base">
        {{ 'delete_account_confirm_title' | transloco }}
      </p>
      <p class="text-sm text-red-500 mt-1">
        {{ 'delete_account_confirm_subtitle' | transloco }}
      </p>
    </div>

    <!-- Actions -->
    <div class="flex gap-3 w-full mt-2">
      <button type="button"
        class="flex-1 rounded-xl border border-zinc-300 dark:border-zinc-600 text-zinc-700 dark:text-zinc-200 font-semibold text-sm py-3 hover:bg-zinc-50 dark:hover:bg-zinc-700 transition"
        (click)="cancelled.emit()">
        {{ 'delete_account_cancel' | transloco }}
      </button>

      <button type="button"
        class="flex-1 rounded-xl bg-red-600 hover:bg-red-700 text-white font-semibold text-sm py-3 transition"
        (click)="confirmed.emit()">
        {{ 'delete_account_confirm' | transloco }}
      </button>
    </div>

  </div>
</div>
