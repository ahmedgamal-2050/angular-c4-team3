<button class="text-zinc-800 dark:text-white hover:text-maroon-600 transition-colors relative">
  <lucide-icon [name]="icon()" size="24" />
  @if (count() > 0) {
    <span
      class="absolute -top-1 -end-1 bg-red-600 dark:bg-red-500 text-white text-[0.625rem] w-4 h-4 rounded-full flex items-center justify-center"
    >
      {{ count() }}
    </span>
  }
</button>
